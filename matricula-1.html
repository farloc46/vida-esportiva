<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vida Esportiva - Matrícula</title>
<style>
body{margin:0;background:#f3f5f7;font-family:Arial;color:#17202a}header{background:#087443;color:white;text-align:center;padding:20px}header img{width:120px;height:70px;object-fit:contain;background:white;border-radius:10px;padding:5px}main{max-width:850px;margin:15px auto;padding:0 12px}.card{background:white;padding:18px;margin:12px 0;border-radius:15px;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:bold;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #ccd5d9;border-radius:9px;box-sizing:border-box}.cat{padding:11px;background:#eaf7ef;border-radius:9px;color:#05613a;font-weight:bold}.check{display:flex;gap:8px;margin:10px 0;padding:10px;background:#f7f9fa;border-radius:9px;font-size:12px}.check input{width:auto}button{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;background:#087443;color:white}.pix{background:#f7f9fa;padding:12px;border-radius:9px;line-height:1.6}.ok,.err{display:none;margin-top:12px;padding:12px;border-radius:9px}.ok{background:#e8f7ee;color:#05613a}.err{background:#fff0f0;color:#a11}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><img src="logo-vida-esportiva-transparente.png" onerror="this.style.display='none'"><h1>Vida Esportiva</h1><div>Ficha de Matrícula Online</div></header>
<main><p style="font-size:12px;color:#6b747d">* Todos os campos obrigatórios precisam ser preenchidos.</p>
<form id="f">
<div class="card"><h2>📝 Dados do aluno</h2><div class="grid"><div class="full"><label>Nome completo do aluno *</label><input id="nome" required></div><div><label>Data de nascimento *</label><input id="nasc" type="date" required></div><div><label>Escola onde estuda *</label><input id="escola" required></div><div><label>Turno escolar *</label><select id="turno" required><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Integral</option><option>Noite</option></select></div><div><label>Profissão do pai/responsável *</label><input id="profissao" required></div><div><label>Categoria</label><div id="cat" class="cat">Informe a data de nascimento</div></div></div></div>
<div class="card"><h2>👨‍👩‍👦 Responsável</h2><div class="grid"><div><label>Nome do responsável *</label><input id="resp" required></div><div><label>WhatsApp *</label><input id="tel" required placeholder="(33) 99999-9999"></div><div><label>CPF *</label><input id="cpf" required></div><div><label>Endereço *</label><input id="end" required></div></div></div>
<div class="card"><h2>💰 Matrícula e Pix</h2><div class="pix"><b>Matrícula:</b> R$ 150,00<br><b>Chave Pix:</b> <span id="pix">Não configurada</span><br><b>Recebedor:</b> <span id="rec">Vida Esportiva</span><br><b>Banco:</b> <span id="bank">—</span></div><br><button type="button" id="copy">📋 Copiar Pix</button></div>
<div class="card"><h2>✅ Confirmações</h2><label class="check"><input id="dados" type="checkbox" required> Confirmo que os dados estão corretos e autorizo seu uso para matrícula e comunicação da escola. *</label><label>Foto do aluno *</label><input id="foto" type="file" accept="image/*" required><label class="check"><input id="atividade" type="checkbox" required> Autorizo meu filho(a) a participar das atividades físicas, esportivas, recreativas e treinamentos da Vida Esportiva. *</label><label class="check"><input id="imagem" type="checkbox" required> Autorizo o uso da imagem do aluno para registros e divulgação das atividades da Vida Esportiva. *</label><button type="submit">Enviar ficha de matrícula</button><div id="ok" class="ok"></div><div id="err" class="err"></div></div>
</form></main>
<script>
const KEY='vida_esportiva_matriculas_pendentes_v1',DB='vida_esportiva_gestao_v4';
function idade(v){let d=new Date(v+'T00:00:00'),h=new Date(),x=h.getFullYear()-d.getFullYear(),m=h.getMonth()-d.getMonth();if(m<0||(m===0&&h.getDate()<d.getDate()))x--;return x}
function categoria(i){if(i>=5&&i<=6)return'5–6 anos';if(i>=8&&i<=10)return'8–10 anos';if(i===9)return'9 anos';if(i>=12&&i<=14)return'12–14 anos';return'Fora das categorias cadastradas'}
nasc.onchange=()=>{let i=idade(nasc.value);cat.textContent=categoria(i)+' • '+i+' anos'}
try{let d=JSON.parse(localStorage.getItem(DB)||'null');if(d&&d.pix){pix.textContent=d.pix.key||'Não configurada';rec.textContent=d.pix.receiver||'Vida Esportiva';bank.textContent=d.pix.bank||'—'}}catch(e){}
copy.onclick=async()=>{if(pix.textContent==='Não configurada'){alert('A chave Pix ainda não foi configurada no painel.');return}try{await navigator.clipboard.writeText(pix.textContent);alert('Pix copiado!')}catch(e){prompt('Copie a chave Pix:',pix.textContent)}}
f.onsubmit=e=>{e.preventDefault();let i=idade(nasc.value),c=categoria(i);if(c==='Fora das categorias cadastradas'){err.textContent='Idade fora das categorias disponíveis.';err.style.display='block';return}let ar=foto.files[0];if(!ar){err.textContent='A foto do aluno é obrigatória.';err.style.display='block';return}let lista=[];try{lista=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(x){lista=[]}lista.push({id:'mat-'+Date.now(),status:'Pendente',dataEnvio:new Date().toISOString(),aluno:{nome:nome.value,nascimento:nasc.value,escola:escola.value,turno:turno.value,profissao:profissao.value,categoria:c},responsavel:{nome:resp.value,telefone:tel.value,cpf:cpf.value,endereco:end.value},fotoNome:ar.name,autorizacoes:{dadosCorretos:dados.checked,atividadeFisica:atividade.checked,usoImagem:imagem.checked}});localStorage.setItem(KEY,JSON.stringify(lista));ok.textContent='Ficha enviada com sucesso. Ela ficará pendente para análise no painel administrativo.';ok.style.display='block';f.reset();cat.textContent='Informe a data de nascimento';window.scrollTo(0,0)}
</script></body></html>
