<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Matrícula Online • Vida Esportiva</title>
<!-- Vida Esportiva • matrícula-1.html • Supabase 2026 -->
<style>
:root{--verde:#087443;--verde2:#05613a;--fundo:#f3f5f7;--texto:#17202a;--muted:#68737d;--linha:#e3e8ec;--azul:#1769d1}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
.top{background:var(--verde2);color:#fff;text-align:center;padding:25px 15px;border-radius:0 0 22px 22px}
.top h1{margin:10px 0 5px;font-size:25px}.sub{opacity:.9}
.wrap{max-width:780px;margin:auto;padding:15px}
.panel{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h2{font-size:20px;margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.cat{padding:12px;border-radius:10px;background:#e9f6ef;border:1px solid #bfe3ce;color:var(--verde2);font-weight:700}
.pix{background:#f7f9fa;border:1px solid var(--linha);border-radius:12px;padding:15px;line-height:1.55;white-space:pre-wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:var(--verde);color:#fff}.blue{background:var(--azul);color:#fff}.secondary{background:#eef2f4;color:#17202a}
.consent{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13px;line-height:1.45}
.consent input{width:18px;margin-top:2px;flex:none}
.msg{display:none;margin-top:15px;padding:14px;border-radius:10px}
.ok{display:block;background:#e9f8ef;color:#075b36;border:1px solid #bfe3ce}
.erro{display:block;background:#fff0ef;color:#b42318;border:1px solid #f0b8b4}
.small{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="top">
<h1>Vida Esportiva</h1>
<div class="sub">Ficha de Matrícula Online</div>
</div>

<main class="wrap">
<form id="form">

<div class="panel">
<h2>📝 Dados do aluno</h2>
<div class="grid">
<div class="full">
<label>Nome completo do aluno *</label>
<input id="aluno" required>
</div>
<div>
<label>Data de nascimento *</label>
<input id="nascimento" type="date" required>
</div>
<div>
<label>Escola onde o aluno estuda *</label>
<input id="escola" required>
</div>
<div>
<label>Turno escolar *</label>
<select id="turno" required>
<option value="">Selecione</option>
<option>Manhã</option>
<option>Tarde</option>
<option>Integral</option>
<option>Noite</option>
</select>
</div>
<div>
<label>Profissão do pai/responsável *</label>
<input id="profissaoPai" required>
</div>
<div>
<label>Categoria</label>
<div id="categoria" class="cat">Informe a data de nascimento</div>
</div>
</div>
</div>

<div class="panel">
<h2>👨‍👩‍👦 Dados do responsável</h2>
<div class="grid">
<div>
<label>Nome do responsável *</label>
<input id="responsavel" required>
</div>
<div>
<label>WhatsApp do responsável *</label>
<input id="telefone" type="tel" required placeholder="(33) 99999-9999">
</div>
<div>
<label>CPF do responsável</label>
<input id="cpf">
</div>
<div>
<label>Endereço</label>
<input id="endereco">
</div>
</div>
</div>

<div class="panel">
<h2>💰 Matrícula e Pix</h2>
<div id="pixBox" class="pix"></div>
<div class="actions">
<button type="button" class="btn secondary" id="copyBtn">📋 Copiar Pix</button>
<button type="button" class="btn blue" id="waBtn">📲 Enviar dados pelo WhatsApp</button>
</div>
</div>

<div class="panel">
<h2>✅ Confirmação</h2>

<label class="consent">
<input type="checkbox" id="aceite" required>
<span>Confirmo que as informações estão corretas e autorizo o uso dos dados para fins de matrícula e comunicação da escola.</span>
</label>

<label class="consent">
<input type="checkbox" id="autorizacaoFisica" required>
<span>Eu, responsável pelo aluno, autorizo meu filho(a) a participar das atividades físicas, esportivas, recreativas e treinamentos promovidos pela Escola de Esportes Vida Esportiva.</span>
</label>

<label class="consent">
<input type="checkbox" id="autorizacaoImagem">
<span>Autorizo o uso da imagem do aluno exclusivamente para registros e divulgação das atividades da Vida Esportiva.</span>
</label>

<button class="btn primary" type="submit" id="enviarBtn">Enviar ficha de matrícula</button>
<div id="msg" class="msg"></div>
</div>

</form>
<p class="small">Esta página não solicita foto do aluno.</p>
</main>

<script>
const CONFIG={
  supabaseUrl:'https://rlpawoxizugzrsrioc.supabase.co',
  supabaseKey:'sb_publishable_fsdNaZ7hzFgxpqB5gGGKRA_mP7daLYJ',
  matriculaValor:150,
  pixKey:'56.980.861-0001-38',
  pixReceiver:'Vida Esportiva',
  pixBank:'Sicoob',
  adminWhatsApp:'33999142507'
};

const $=id=>document.getElementById(id);

function idade(data){
  if(!data)return null;
  const n=new Date(data+'T00:00:00'), h=new Date();
  let a=h.getFullYear()-n.getFullYear();
  const m=h.getMonth()-n.getMonth();
  if(m<0||(m===0&&h.getDate()<n.getDate()))a--;
  return a;
}

function categoria(a){
  if(a===null)return '';
  if(a>=5&&a<=7)return '5–7 anos';
  if(a>=8&&a<=10)return '8–10 anos';
  if(a===11)return 'Sem categoria';
  if(a>=12&&a<=14)return '12–14 anos';
  return '';
}

function atualizarCategoria(){
  const c=categoria(idade($('nascimento').value));
  $('categoria').textContent=c||'Sem categoria disponível';
}

function dados(){
  const a=idade($('nascimento').value);
  return {
    aluno:$('aluno').value.trim(),
    nascimento:$('nascimento').value,
    escola:$('escola').value.trim(),
    turno:$('turno').value,
    profissaoPai:$('profissaoPai').value.trim(),
    categoria:categoria(a),
    responsavel:$('responsavel').value.trim(),
    telefone:$('telefone').value.trim(),
    cpf:$('cpf').value.trim(),
    endereco:$('endereco').value.trim(),
    matriculaValor:CONFIG.matriculaValor,
    aceite:$('aceite').checked,
    autorizacaoFisica:$('autorizacaoFisica').checked,
    autorizacaoImagem:$('autorizacaoImagem').checked
  };
}

function pix(){
  return `Matrícula: R$ ${CONFIG.matriculaValor.toFixed(2).replace('.',',')}

🔑 Pix: ${CONFIG.pixKey}
👤 Recebedor: ${CONFIG.pixReceiver}
🏦 Banco: ${CONFIG.pixBank}

Após o pagamento, envie o comprovante pelo WhatsApp da Vida Esportiva.`;
}

$('nascimento').addEventListener('change',atualizarCategoria);
$('pixBox').textContent=pix();

$('copyBtn').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(CONFIG.pixKey);
    alert('Chave Pix copiada!');
  }catch(e){
    prompt('Copie a chave Pix:',CONFIG.pixKey);
  }
};

$('waBtn').onclick=()=>{
  const d=dados();
  const texto=`Olá, Vida Esportiva!

Gostaria de realizar a matrícula do aluno.

Aluno: ${d.aluno}
Nascimento: ${d.nascimento}
Categoria: ${d.categoria}
Escola: ${d.escola}
Turno: ${d.turno}
Responsável: ${d.responsavel}
WhatsApp: ${d.telefone}
CPF: ${d.cpf||'Não informado'}
Endereço: ${d.endereco||'Não informado'}

Matrícula: R$ ${d.matriculaValor.toFixed(2).replace('.',',')}`;
  window.open('https://wa.me/55'+CONFIG.adminWhatsApp+'?text='+encodeURIComponent(texto),'_blank');
};

async function salvar(d){
  // Envio por formulário nativo (sem fetch/CORS). O Supabase PostgREST aceita
  // application/x-www-form-urlencoded em POST, e a publishable key pode ser
  // enviada como parâmetro de URL.
  return new Promise((resolve,reject)=>{
    let finished=false;
    const iframeName='supabase_submit_frame_'+Date.now();
    const iframe=document.createElement('iframe');
    iframe.name=iframeName;
    iframe.style.display='none';
    document.body.appendChild(iframe);

    const form=document.createElement('form');
    form.method='POST';
    form.action=CONFIG.supabaseUrl+'/rest/v1/matriculas?apikey='+encodeURIComponent(CONFIG.supabaseKey);
    form.target=iframeName;
    form.enctype='application/x-www-form-urlencoded';
    form.style.display='none';

    const payload={
      nome_aluno:d.aluno||'',
      escola:d.escola||'',
      turno_escolar:d.turno||'',
      nome_responsavel:d.responsavel||'',
      telefone_responsavel:d.telefone||'',
      categoria:d.categoria||'',
      profissao_pai:d.profissaoPai||'',
      responsavel:d.responsavel||'',
      telefone:d.telefone||'',
      cpf:d.cpf||'',
      endereco:d.endereco||'',
      autorizacao_fisica:d.autorizacaoFisica?'true':'false',
      autorizacao_imagem:d.autorizacaoImagem?'true':'false',
      aceite:d.aceite?'true':'false',
      aluno:d.aluno||'',
      nascimento:d.nascimento||'',
      matricula_valor:String(Number(d.matriculaValor||0)),
      taxa_matricula:String(Number(d.matriculaValor||0))
    };

    // Só envia a coluna date quando há uma data válida, evitando erro de data vazia.
    if(d.nascimento){
      const inputDate=document.createElement('input');
      inputDate.type='hidden';
      inputDate.name='data_nascimento';
      inputDate.value=d.nascimento;
      form.appendChild(inputDate);
    }

    Object.entries(payload).forEach(([name,value])=>{
      const input=document.createElement('input');
      input.type='hidden';
      input.name=name;
      input.value=value;
      form.appendChild(input);
    });

    document.body.appendChild(form);

    // Não tentamos ler a resposta do Supabase, pois ela está em outro domínio.
    // O envio é feito pelo formulário nativo e o iframe mantém a página aberta.
    const cleanup=()=>{
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
      if(form.parentNode) form.parentNode.removeChild(form);
    };

    setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve();
    },2500);

    try{
      form.submit();
    }catch(err){
      if(finished)return;
      finished=true;
      cleanup();
      reject(err);
    }
  });
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const d=dados();

  if(!d.categoria){
    $('msg').className='msg erro';
    $('msg').style.display='block';
    $('msg').textContent='A idade informada não possui categoria disponível.';
    return;
  }

  $('enviarBtn').disabled=true;
  $('enviarBtn').textContent='Enviando...';
  $('msg').className='msg';
  $('msg').style.display='block';
  $('msg').textContent='Enviando matrícula...';

  try{
    await salvar(d);
    $('msg').className='msg ok';
    $('msg').textContent='✅ Matrícula enviada com sucesso! A Vida Esportiva recebeu os dados.';
    $('form').reset();
    atualizarCategoria();
    $('pixBox').textContent=pix();
  }catch(err){
    $('msg').className='msg erro';
    const detalhe=err&&err.message?err.message:'Erro desconhecido.';
    $('msg').innerHTML='❌ <strong>Não foi possível salvar a matrícula.</strong><br><small>'+detalhe.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</small>';
    console.error('Erro ao enviar matrícula:',err);
  }finally{
    $('enviarBtn').disabled=false;
    $('enviarBtn').textContent='Enviar ficha de matrícula';
  }
});
</script>
</body>
</html>
